<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="title desc">
  <title id="title">sreynosolabs</title>
  <desc id="desc">I build the software your business runs on. Websites, custom apps, integrations and AI automation.</desc>
  <defs>
    <style>
      @font-face { font-family: "SRL Archivo"; src: url(data:font/woff2;base64,{{ARCHIVO}}) format("woff2"); font-weight: 700 900; }
      @font-face { font-family: "SRL Mono"; src: url(data:font/woff2;base64,{{MONO}}) format("woff2"); font-weight: 400 600; }
      .disp { font-family: "SRL Archivo", "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 800; }
      .mono { font-family: "SRL Mono", Consolas, "Courier New", monospace; }
      .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s cubic-bezier(.6,0,.2,1) forwards; }
      .pop { opacity: 0; animation: pop .6s ease-out forwards; }
      .bar { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: grow .9s cubic-bezier(.3,1.4,.5,1) forwards; }
      .march { stroke-dasharray: 3 7; animation: march 1.2s linear infinite; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .live { transform-box: fill-box; transform-origin: center; animation: live 2s ease-out infinite; }
      .in { opacity: 0; animation: pop .8s ease-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes grow { to { transform: scaleY(1); } }
      @keyframes march { to { stroke-dashoffset: -20; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes live { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(3.2); } }
      @media (prefers-reduced-motion: reduce) {
        .draw, .pop, .bar, .march, .blink, .live, .in { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; }
        .live { opacity: 0; }
      }
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#16304f" stroke-width="1"/>
    </pattern>
    <pattern id="grid-major" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M160 0H0V160" fill="none" stroke="#1d3d63" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".25"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="grid-mask"><rect width="1280" height="420" fill="url(#fade)"/></mask>
    <radialGradient id="glow-amber" cx="1030" cy="190" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb547" stop-opacity=".13"/>
      <stop offset="1" stop-color="#ffb547" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-blue" cx="160" cy="80" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5aa0ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#5aa0ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1280" height="420" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="#0a1628"/>
    <g mask="url(#grid-mask)">
      <rect width="1280" height="420" fill="url(#grid)"/>
      <rect width="1280" height="420" fill="url(#grid-major)"/>
    </g>
    <rect width="1280" height="420" fill="url(#glow-blue)"/>
    <rect width="1280" height="420" fill="url(#glow-amber)"/>

    <!-- crop marks -->
    <g stroke="#ffb547" stroke-width="2" fill="none" opacity=".7">
      <path d="M24 44V24H44"/><path d="M1236 24H1256V44"/><path d="M24 376V396H44"/><path d="M1256 376V396H1236"/>
    </g>

    <!-- monogram + wordmark -->
    <g class="in" style="animation-delay:.1s">
      <rect x="72" y="58" width="76" height="76" rx="14" fill="#10213a" stroke="#5aa0ff" stroke-width="2.5"/>
      <text x="110" y="113" text-anchor="middle" class="disp" font-size="40" font-weight="900" letter-spacing="-1"><tspan fill="#eef3fa">S</tspan><tspan fill="#ffb547">R</tspan></text>
      <text x="168" y="98" class="disp" font-size="34" fill="#eef3fa">sreynosolabs</text>
      <text x="170" y="124" class="mono" font-size="13" letter-spacing="2.5" fill="#5aa0ff">CUSTOM SOFTWARE · MADE IN PERU</text>
    </g>

    <!-- headline -->
    <g class="in" style="animation-delay:.35s">
      <text x="70" y="222" class="disp" font-size="46" fill="#eef3fa" letter-spacing="-.5">I build the software</text>
      <text x="70" y="276" class="disp" font-size="46" fill="#eef3fa" letter-spacing="-.5">your business <tspan fill="#ffb547">runs on.</tspan></text>
    </g>
    <text x="72" y="324" class="mono in" font-size="16" fill="#8ea3c0" style="animation-delay:.6s">Websites · Custom apps · Integrations · AI automation</text>

    <!-- dimension line -->
    <g stroke="#2b5a8f" stroke-width="1.5" fill="none">
      <path class="draw" pathLength="1" d="M72 372H560" style="animation-delay:.8s"/>
      <path d="M72 364V380M560 364V380"/>
      <path d="M80 367L72 372L80 377M552 367L560 372L552 377"/>
    </g>
    <rect x="172" y="362" width="288" height="20" fill="#0a1628"/>
    <text x="316" y="376" text-anchor="middle" class="mono in" font-size="11" letter-spacing="2" fill="#5aa0ff" style="animation-delay:1.1s">7+ YEARS OF PRODUCTION SOFTWARE</text>

    <!-- figure label -->
    <text x="1210" y="54" text-anchor="end" class="mono in" font-size="11" letter-spacing="2" fill="#2b5a8f" style="animation-delay:.4s">FIG. 01 — YOUR APP, BUILDING ITSELF</text>

    <!-- app window -->
    <path d="M860 64H1200A10 10 0 0 1 1210 74V298A10 10 0 0 1 1200 308H860A10 10 0 0 1 850 298V74A10 10 0 0 1 860 64Z" fill="#10213a" fill-opacity=".7"/>
    <path class="draw" pathLength="1" d="M860 64H1200A10 10 0 0 1 1210 74V298A10 10 0 0 1 1200 308H860A10 10 0 0 1 850 298V74A10 10 0 0 1 860 64Z" fill="none" stroke="#5aa0ff" stroke-width="1.5"/>
    <path class="draw" pathLength="1" d="M850 92H1210" stroke="#2b5a8f" stroke-width="1.5" style="animation-delay:.5s"/>
    <g class="pop" style="animation-delay:.9s">
      <circle cx="866" cy="78" r="4" fill="#2b5a8f"/><circle cx="880" cy="78" r="4" fill="#2b5a8f"/><circle cx="894" cy="78" r="4" fill="#2b5a8f"/>
      <rect x="920" y="71" width="176" height="14" rx="7" fill="#0a1628" stroke="#2b5a8f"/>
      <text x="932" y="81.5" class="mono" font-size="9" fill="#8ea3c0">https://your-business.com</text>
      <circle class="live" cx="1150" cy="78" r="3.5" fill="#ffb547"/>
      <circle cx="1150" cy="78" r="3.5" fill="#ffb547"/>
      <text x="1196" y="81.5" text-anchor="end" class="mono" font-size="9" letter-spacing="1.5" fill="#ffb547">LIVE</text>
    </g>

    <!-- hero block -->
    <g class="pop" style="animation-delay:1.2s">
      <rect x="870" y="110" width="140" height="13" rx="2" fill="#eef3fa"/>
      <rect x="870" y="129" width="104" height="13" rx="2" fill="#eef3fa"/>
      <rect x="870" y="150" width="120" height="6" rx="2" fill="#8ea3c0" opacity=".7"/>
      <rect x="870" y="161" width="92" height="6" rx="2" fill="#8ea3c0" opacity=".7"/>
      <rect x="870" y="176" width="70" height="18" rx="4" fill="#ffb547"/>
      <rect x="948" y="176" width="56" height="18" rx="4" fill="none" stroke="#5aa0ff"/>
      <rect x="1012" y="129" width="3" height="13" fill="#ffb547" class="blink"/>
    </g>

    <!-- chart card -->
    <rect class="pop" x="1040" y="108" width="152" height="88" rx="6" fill="#0a1628" stroke="#2b5a8f" style="animation-delay:1.35s"/>
    <g>
      <rect class="bar" x="1054" y="166" width="12" height="20" rx="2" fill="#2b5a8f" style="animation-delay:1.6s"/>
      <rect class="bar" x="1076" y="152" width="12" height="34" rx="2" fill="#2b5a8f" style="animation-delay:1.7s"/>
      <rect class="bar" x="1098" y="158" width="12" height="28" rx="2" fill="#5aa0ff" style="animation-delay:1.8s"/>
      <rect class="bar" x="1120" y="140" width="12" height="46" rx="2" fill="#5aa0ff" style="animation-delay:1.9s"/>
      <rect class="bar" x="1142" y="130" width="12" height="56" rx="2" fill="#5aa0ff" style="animation-delay:2s"/>
      <rect class="bar" x="1164" y="118" width="12" height="68" rx="2" fill="#ffb547" style="animation-delay:2.1s"/>
    </g>

    <!-- cards row -->
    <g fill="#0a1628" stroke="#2b5a8f">
      <g class="pop" style="animation-delay:1.5s">
        <rect x="870" y="212" width="98" height="78" rx="6"/>
        <rect x="882" y="224" width="22" height="22" rx="5" fill="#16304f" stroke="#5aa0ff"/>
        <rect x="882" y="256" width="66" height="6" rx="2" fill="#8ea3c0" stroke="none" opacity=".7"/>
        <rect x="882" y="268" width="46" height="6" rx="2" fill="#8ea3c0" stroke="none" opacity=".45"/>
      </g>
      <g class="pop" style="animation-delay:1.65s">
        <rect x="982" y="212" width="98" height="78" rx="6"/>
        <rect x="994" y="224" width="22" height="22" rx="5" fill="#16304f" stroke="#5aa0ff"/>
        <rect x="994" y="256" width="70" height="6" rx="2" fill="#8ea3c0" stroke="none" opacity=".7"/>
        <rect x="994" y="268" width="40" height="6" rx="2" fill="#8ea3c0" stroke="none" opacity=".45"/>
      </g>
      <g class="pop" style="animation-delay:1.8s">
        <rect x="1094" y="212" width="98" height="78" rx="6"/>
        <rect x="1106" y="224" width="22" height="22" rx="5" fill="#3a2a10" stroke="#ffb547"/>
        <rect x="1106" y="256" width="62" height="6" rx="2" fill="#8ea3c0" stroke="none" opacity=".7"/>
        <rect x="1106" y="268" width="50" height="6" rx="2" fill="#8ea3c0" stroke="none" opacity=".45"/>
      </g>
    </g>

    <!-- integrations -->
    <g fill="none" stroke="#5aa0ff" stroke-width="1.5">
      <path class="march" d="M919 308V344"/>
      <path class="march" d="M1030 308V344" style="animation-delay:-.4s"/>
      <path class="march" d="M1141 308V344" style="animation-delay:-.8s"/>
    </g>
    <g class="pop" style="animation-delay:2.2s">
      <rect x="871" y="344" width="96" height="28" rx="14" fill="#10213a" stroke="#5aa0ff" stroke-width="1.5"/>
      <rect x="982" y="344" width="96" height="28" rx="14" fill="#3a2a10" stroke="#ffb547" stroke-width="1.5"/>
      <rect x="1093" y="344" width="96" height="28" rx="14" fill="#10213a" stroke="#5aa0ff" stroke-width="1.5"/>
      <text x="919" y="362" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#eef3fa">APIs</text>
      <text x="1030" y="362" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#ffb547">AI</text>
      <text x="1141" y="362" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#eef3fa">DATA</text>
    </g>
  </g>
</svg>
