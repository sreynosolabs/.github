<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-labelledby="title desc">
  <title id="title">How I work</title>
  <desc id="desc">From the first conversation to working software: understand the business, design, build, test, ship, train and support.</desc>
  <defs>
    <style>
      @font-face { font-family: "SRL Archivo"; src: url(data:font/woff2;base64,{{ARCHIVO}}) format("woff2"); font-weight: 700 900; }
      @font-face { font-family: "SRL Mono"; src: url(data:font/woff2;base64,{{MONO}}) format("woff2"); font-weight: 400 600; }
      .disp { font-family: "SRL Archivo", "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 800; }
      .mono { font-family: "SRL Mono", Consolas, "Courier New", monospace; }
      .progress { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: progress 8s linear infinite; }
      .pulse { animation: travel 8s linear infinite; }
      .node { animation: lit 8s ease-out infinite; }
      @keyframes progress { 0% { transform: scaleX(0); opacity: 1; } 75% { transform: scaleX(1); opacity: 1; } 88% { transform: scaleX(1); opacity: 0; } 100% { transform: scaleX(0); opacity: 0; } }
      @keyframes travel { 0% { transform: translateX(0); opacity: 1; } 75% { transform: translateX(1060px); opacity: 1; } 88%, 100% { transform: translateX(1060px); opacity: 0; } }
      @keyframes lit { 0% { stroke: #ffb547; fill: #3a2a10; } 20% { stroke: #ffb547; fill: #3a2a10; } 40%, 100% { stroke: #5aa0ff; fill: #0a1628; } }
      @media (prefers-reduced-motion: reduce) {
        .progress, .pulse, .node { animation: none; }
        .progress { transform: scaleX(1); }
        .pulse { opacity: 0; }
      }
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#16304f" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".7"/>
    </linearGradient>
    <mask id="grid-mask"><rect width="1280" height="300" fill="url(#fade)"/></mask>
    <radialGradient id="pulse-glow">
      <stop offset="0" stop-color="#ffb547" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb547" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1280" height="300" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="300" fill="#0a1628"/>
    <rect width="1280" height="300" fill="url(#grid)" mask="url(#grid-mask)"/>

    <text x="72" y="64" class="mono" font-size="13" letter-spacing="2.5" fill="#5aa0ff">HOW I WORK</text>
    <text x="70" y="104" class="disp" font-size="32" fill="#eef3fa" letter-spacing="-.3">From the first conversation to <tspan fill="#ffb547">working software</tspan></text>
    <text x="1208" y="64" text-anchor="end" class="mono" font-size="12" letter-spacing="1.5" fill="#8ea3c0">FIXED PRICE PER PROJECT · NEVER BY THE HOUR</text>

    <!-- track -->
    <path d="M110 176H1170" stroke="#16304f" stroke-width="4" stroke-linecap="round"/>
    <path d="M110 176H1170" stroke="#2b5a8f" stroke-width="1.5" stroke-dasharray="2 6"/>
    <rect class="progress" x="110" y="174.5" width="1060" height="3" rx="1.5" fill="#ffb547"/>

    <!-- nodes -->
    <g stroke-width="2" stroke="#5aa0ff" fill="#0a1628">
      <circle class="node" cx="110" cy="176" r="17" style="animation-delay:0s"/>
      <circle class="node" cx="286.67" cy="176" r="17" style="animation-delay:1s"/>
      <circle class="node" cx="463.33" cy="176" r="17" style="animation-delay:2s"/>
      <circle class="node" cx="640" cy="176" r="17" style="animation-delay:3s"/>
      <circle class="node" cx="816.67" cy="176" r="17" style="animation-delay:4s"/>
      <circle class="node" cx="993.33" cy="176" r="17" style="animation-delay:5s"/>
      <circle class="node" cx="1170" cy="176" r="17" style="animation-delay:6s"/>
    </g>
    <g class="mono" font-size="11" font-weight="600" fill="#eef3fa" text-anchor="middle">
      <text x="110" y="180">01</text><text x="286.67" y="180">02</text><text x="463.33" y="180">03</text><text x="640" y="180">04</text>
      <text x="816.67" y="180">05</text><text x="993.33" y="180">06</text><text x="1170" y="180">07</text>
    </g>

    <!-- pulse -->
    <g class="pulse">
      <circle cx="110" cy="176" r="22" fill="url(#pulse-glow)"/>
      <circle cx="110" cy="176" r="5" fill="#ffb547"/>
    </g>

    <!-- labels -->
    <g class="disp" font-size="19" fill="#eef3fa" text-anchor="middle">
      <text x="110" y="228">Understand</text><text x="286.67" y="228">Design</text><text x="463.33" y="228">Build</text>
      <text x="640" y="228">Test</text><text x="816.67" y="228">Ship</text><text x="993.33" y="228">Train</text><text x="1170" y="228">Support</text>
    </g>
    <g class="mono" font-size="11" fill="#8ea3c0" text-anchor="middle">
      <text x="110" y="250">your business</text><text x="286.67" y="250">validated together</text><text x="463.33" y="250">AI as a tool</text>
      <text x="640" y="250">automated</text><text x="816.67" y="250">with rollback</text><text x="993.33" y="250">your team</text><text x="1170" y="250">after launch</text>
    </g>
  </g>
</svg>
